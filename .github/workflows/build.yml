name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Генерація Gradle Wrapper 8.7 у тимчасовій папці без перевірки build.gradle
      - name: Generate Gradle Wrapper
        run: |
          mkdir temp_wrapper && cd temp_wrapper
          gradle wrapper --gradle-version 8.7
          cd ..
          cp -r temp_wrapper/gradlew temp_wrapper/gradlew.bat temp_wrapper/gradle .
          chmod +x gradlew
          rm -rf temp_wrapper

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeriaApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
